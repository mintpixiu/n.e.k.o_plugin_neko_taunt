name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The current standard Market release workflow attests the package with
# actions/attest-build-provenance, so the caller must also grant the OIDC and
# attestation permissions it requests.  Without these the reusable workflow
# fails at startup (GitHub rejects the permission escalation).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@main
    with:
      plugin-id: neko_taunt
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
